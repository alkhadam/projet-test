name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permissions minimales : lecture seule du dépôt
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Security scan (bandit)
        run: bandit -q -r . -x ./tests,./.venv
      - name: Tests (pytest)
        run: pytest -q
